<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест до Модуля 4</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:
linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
url('IMG_9043.jpeg');
background-size:cover;
background-position:center;
background-attachment:fixed;
color:white;
}
.container{
max-width:800px;
margin:auto;
padding:20px;
}
.card{

background:rgba(30,20,15,.65);

border-radius:25px;

padding:25px;

margin-top:30px;

border:1px solid rgba(255,255,255,.08);

}
h1,h2,h3{
text-align:center;
}
h1h1{

    font-size:38px;

    text-align:center;

    margin:0 0 15px;

}
input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
box-sizing:border-box;
}
button{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:#e7c998;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}
.answer{
display:block;
padding:12px;
margin:10px 0;
background:rgba(255,255,255,.08);
border-radius:12px;
cursor:pointer;
}
.progress{
height:12px;
background:rgba(255,255,255,.15);
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}
.bar{
height:100%;
width:0%;
background:#e7c998;
}
.result{
text-align:center;
font-size:22px;
}
</style>
</head>
<body>
<div class="container">
<div class="card" id="start">
<h1>Lerri Lashes Academy</h1>
<h2>📚 Тест до Модуля 4</h2>

<h3>Перевірка знань</h3>
<input id="studentName" placeholder="Введіть ім'я та прізвище">

<button onclick="startQuiz()">Почати тест</button>

</div>
<div class="card" id="quiz" style="display:none">
<div class="progress">
<div class="bar" id="bar"></div>
</div>
<div id="counter"></div>
<h3 id="question"></h3>
<div id="answers"></div>
</div>
<div class="card result" id="result" style="display:none"></div>
</div>
<script>
const TOKEN="";
const CHAT_ID="";
const questions = [
["Що необхідно зробити одразу після того, як клієнт сів/ліг на кушетку?",
["Приклеїти патчі.","Оцінити натуральні вії та обговорити майбутнє нарощування.","Намалювати схему.","Почати очищення вій."],1],

["Який відступ від повіки вважається правильним?",
["0 мм.","2 мм.","0,3–1 мм.","3 мм."],2],

["Чому важливо приклеювати штучну вію паралельно натуральній?",
["Так швидше працювати.","Так легше формувати пучки.","Це забезпечує правильну контактну зону та довгу носку вій.","Щоб вії здавалися густішими."],2],

["Коли майстер повинен перевіряти роботу на наявність склейок?",
["Після того як приклеїв пучок.","Після зняття патчів.","Під час нарощування.","Після завершення нарощування, перед зняттям патчів."],3],

["Що може статися, якщо клієнт під час процедури постійно розмовляє?",
["Клей швидше полімеризується.","Швидше виконаєте нарощування.","Очі можуть відкриватися, що підвищує ризик почервоніння та опіку.","Клей потрапить в око."],2],

["Яка рекомендація щодо догляду є правильною?",
["Не мочити вії постійно.","Використовувати будь-яку косметику.","Спати лише на спині.","Щодня очищати вії спеціальною пінкою та водою."],3],

["Клієнт написав через 5 днів, що частина вій осипалася. Як правильно вчинити, якщо у вас діє стандартна гарантія?",
["Запропонувати записатися за повною вартістю.","Відмовити, адже це нормально.","Запросити клієнта на безкоштовну корекцію або перенарощування.","Порадити почекати ще тиждень."],2],

["Що потрібно зробити, якщо після процедури клієнту не подобається результат?",
["Пояснити, що звикне.","Попросити написати через декілька днів.","Вирішити питання одразу, поки клієнт знаходиться у вас.","Сказати, що ви зробили все за запитом."],2],

["Для чого майстер перевіряє положення патчів під час роботи?",
["Щоб вони не відклеїлися.","Лише для комфорту клієнта.","Щоб патч не зʼїхав та не почав терти око, а також щоб не вилізли нижні вії.","Щоб пінцети не ковзали."],2],

["Яка головна мета правильної послідовності всіх етапів нарощування?",
["Скоротити час процедури.","Використати менше матеріалів.","Щоб нічого не забути.","Забезпечити безпечну процедуру, якісний результат і довгу носку вій."],3]
];
let current=0;
let score=0;
let mistakes=[]; 
function startQuiz(){
const name=document.getElementById("studentName").value.trim();
if(!name){
alert("Введіть ім'я та прізвище");
return;
}
document.getElementById("start").style.display="none";
document.getElementById("quiz").style.display="block";
showQuestion();
}
function showQuestion(){
const q=questions[current];
document.getElementById("counter").innerHTML=
`Питання ${current+1} із ${questions.length}`;
document.getElementById("question").innerHTML=q[0];
document.getElementById("bar").style.width=
((current/questions.length)*100)+"%";
let html="";
q[1].forEach((a,i)=>{
html+=`
<label class="answer">
<input type="radio" name="ans" value="${i}">
${a}
</label>
`;
});
html+=`<button onclick="nextQuestion()">Далі</button>`;
document.getElementById("answers").innerHTML=html;
}
function nextQuestion(){

const checked=document.querySelector('input[name="ans"]:checked');

if(!checked){

alert("Оберіть відповідь");

return;

}

const userAnswer=Number(checked.value);

const correctAnswer=questions[current][2];

if(userAnswer===correctAnswer){

score++;

}else{

mistakes.push({

question: questions[current][0],

user: questions[current][1][userAnswer],

correct: questions[current][1][correctAnswer]

});

}

current++;

if(current>=questions.length){

finishQuiz();

}else{

showQuestion();

}

}

async function finishQuiz(){
document.getElementById("quiz").style.display="none";
const percent=Math.round(score/questions.length*100);
const passed=score>=8;
document.getElementById("result").style.display="block";
document.getElementById("result").innerHTML=
passed
?
`🎉 <h2>Тест успішно складено</h2>

<h3>${score}/10 (${percent}%)</h3>`

:
`❌ <h2>Тест не складено</h2>
<h3>${score}/10 (${percent}%)</h3>
<p>Необхідно мінімум 8 правильних відповідей</p>`;
let text=

`📚 Тест до Модуля 4

👤 Учениця: ${document.getElementById("studentName").value}

🏆 Результат: ${score}/10

📊 ${percent}%

${passed ? "✅ Тест складено" : "❌ Тест НЕ складено"}

`;

if(mistakes.length){

text += "\n\n❌ Помилки:\n\n";

mistakes.forEach((m,index)=>{

text +=

`${index+1}️⃣ ${m.question}

❌ Відповідь учениці:

${m.user}

✅ Правильна відповідь:

${m.correct}

━━━━━━━━━━━━━━

`;

});

}
try{
await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
chat_id:CHAT_ID,
text:text
})
});
}catch(e){}
}
</script>
</body>
</html>
